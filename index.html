<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mytaim-app</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
    <!-- Moyasar Styles -->
    <link
      rel="stylesheet"
      href="https://cdn.moyasar.com/mpf/1.13.0/moyasar.css"
    />
    <!-- Moyasar Script -->
    <script src="https://cdn.moyasar.com/mpf/1.13.0/moyasar.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 🧹 سكريبت التدمير الشامل للكاش والـ Service Workers القديمة
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister(); // إيقاف أي عامل خدمة قديم
            }
          });
      }

      // مسح الكاش المحلي الخاص بالمتصفح
      if ("caches" in window) {
        caches.keys().then((keyList) => {
          return Promise.all(
            keyList.map((key) => {
              return caches.delete(key);
            }),
          );
        });
      }
    </script>
  </body>
</html>
