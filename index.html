<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Book on Map</title>

    <script>
      // 1. حذف الـ Service Workers التي تسبب عدم فتح الموقع في كروم الجوال
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log("ServiceWorker Unregistered");
              });
            }
          });
      }

      // 2. تفريغ جميع خزائن الـ Cache البرمجية
      if ("caches" in window) {
        caches.keys().then(function (names) {
          for (let name of names) caches.delete(name);
        });
      }

      // 3. آلية التحديث الإجباري (Force Reload) عند تغيير رقم الإصدار
      // غير الرقم (مثلاً إلى 1.0.4) في كل مرة تريد فيها إجبار جميع المستخدمين على التحديث
      const APP_VERSION = "1.0.3";
      const storedVersion = localStorage.getItem("app_version");
      if (storedVersion !== APP_VERSION) {
        localStorage.clear(); // مسح الـ LocalStorage لضمان نظافة البيانات
        localStorage.setItem("app_version", APP_VERSION);
        window.location.reload(true); // إعادة تحميل إجبارية من السيرفر
      }
    </script>

    <style>
      /* إجبار المتصفح على اعتبار نظام الألوان فاتح دائماً في خانات الإدخال */
      input,
      textarea,
      select {
        color-scheme: light !important;
        background-color: white !important;
        color: black !important;
        -webkit-text-fill-color: black !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // التأكد من مسح أي أثار للكاش بعد اكتمال التحميل
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.ready.then((reg) => reg.unregister());
        }
      });
    </script>
  </body>
</html>
